<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Planet Pulse is a live world monitor: earthquakes, headlines, the ISS, weather, markets and football fixtures in one reactive timeline."
    />
    <meta name="theme-color" content="#111210" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f1efe6" media="(prefers-color-scheme: light)" />

    <script>
      (() => {
        try {
          const stored = localStorage.getItem('pulse:theme');
          const theme = stored
            ? JSON.parse(stored)
            : window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
          document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark';
          document.documentElement.style.colorScheme = theme;
        } catch {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>

    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><rect width=%2264%22 height=%2264%22 rx=%228%22 fill=%22%23111210%22/><path d=%22M10 34h10l5-13 8 26 5-13h16%22 fill=%22none%22 stroke=%22%23ff6a3d%22 stroke-width=%223%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/></svg>"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <title>Planet Pulse — Live world monitor</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font-family: system-ui; padding: 24px">
        Planet Pulse is a live, client-rendered monitor. Please enable
        JavaScript to view the feeds.
      </p>
    </noscript>
    <script src="/src/index.tsx" type="module"></script>
  </body>
</html>
